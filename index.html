<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weekly Safety Briefing — Week of 05.10.2026</title>
<meta name="description" content="Weekly site safety briefing: metal cage entry, Wednesday concrete pour traffic plan and access, and flagman availability. English and Greek.">

<meta property="og:type" content="video.other">
<meta property="og:title" content="Weekly Safety Briefing — Week of 05.10.2026">
<meta property="og:description" content="Three priorities for the site this week: metal cage entry, Wednesday concrete pour, flagman on duty.">
<meta property="og:image" content="poster_W41.jpg">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230D1014'/><rect x='7' y='10' width='18' height='4' rx='1' fill='%23F2B417'/><rect x='7' y='18' width='12' height='4' rx='1' fill='%23F2B417'/></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#08090C;
    --stage-a:#101419;
    --stage-b:#0B0E12;
    --panel:#161A20;
    --panel-2:#1B2026;
    --line:#252B33;
    --line-soft:#1E232A;
    --accent:#F2B417;
    --accent-hi:#FFD24D;
    --teal:#3ED6A0;
    --red:#E0413E;
    --blue:#7FB2D8;
    --steel:#8FA3B4;
    --text:#E9ECEF;
    --white:#FFFFFF;
    --muted:#8B939C;
    --dim:#5E666F;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--bg);color:var(--text);font-family:var(--sans);
    line-height:1.55;-webkit-font-smoothing:antialiased;
    padding:clamp(14px,3vw,34px);
  }
  .wrap{max-width:1240px;margin:0 auto}

  /* ---------- top bar ---------- */
  .topbar{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding-bottom:16px;margin-bottom:20px;border-bottom:1px solid var(--line);
  }
  .mark{width:24px;height:15px;border-radius:3px;background:var(--accent);flex:none}
  .brand{font-family:var(--mono);font-weight:700;letter-spacing:.14em;font-size:15px}
  .brand-sub{
    font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--muted);
    text-transform:uppercase;padding-left:14px;border-left:1px solid var(--line);
  }
  .lang{margin-left:auto;display:flex;gap:6px;align-items:center}
  .lang-label{
    font-family:var(--mono);font-size:10px;letter-spacing:.18em;
    color:var(--dim);text-transform:uppercase;margin-right:4px;
  }
  .lang button{
    font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.12em;
    color:var(--muted);background:var(--panel);border:1px solid var(--line);
    padding:7px 14px;border-radius:6px;cursor:pointer;
    transition:background .15s,color .15s,border-color .15s;
  }
  .lang button:hover{color:var(--text);border-color:#39424c}
  .lang button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#14100A}
  .lang button:focus-visible{outline:2px solid var(--accent-hi);outline-offset:2px}

  h1.page-title{
    font-size:clamp(26px,4.4vw,40px);line-height:1.05;letter-spacing:-.02em;
    font-weight:800;margin-bottom:6px;
  }
  .page-tag{color:var(--muted);font-size:15px;margin-bottom:20px;max-width:64ch}

  /* ---------- stage (fixed 1920x1080, scaled to fit) ---------- */
  .stage-outer{
    position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;
    background:#000;border:1px solid var(--line);border-radius:10px;
    box-shadow:0 20px 56px rgba(0,0,0,.55);
  }
  .stage{
    position:absolute;top:0;left:0;width:1920px;height:1080px;overflow:hidden;
    transform-origin:top left;
    background:
      radial-gradient(1200px 700px at 72% 18%, #151A21 0%, rgba(21,26,33,0) 62%),
      linear-gradient(160deg,var(--stage-a) 0%,var(--stage-b) 60%,#080A0D 100%);
    font-size:16px;
  }

  /* ---------- speaker window (reserved — nothing overlaps it) ---------- */
  .spk{
    position:absolute;left:66px;top:50px;width:364px;height:204px;
    border:1px solid #2A3038;border-radius:4px;overflow:hidden;background:#07090B;
  }
  .spk video{
    position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 59%;
    display:block;background:#07090B;
  }
  .spk video:not([src]){display:none}
  .spk::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 40px rgba(0,0,0,.45)}
  .spk-ph{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;
    border:0;background:repeating-linear-gradient(135deg,#0A0C0F 0 14px,#0C0F13 14px 28px);
    color:var(--dim);cursor:pointer;font:inherit;width:100%;
  }
  .spk-ph svg{width:34px;height:34px;fill:none;stroke:#3A424C;stroke-width:1.6}
  .spk-ph .l1{font-family:var(--mono);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#6B747E}
  .spk-ph .l2{font-size:12px;color:#4C545D}
  .spk-ph:hover .l1{color:var(--accent)}
  .spk-ph:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .spk.drag .spk-ph{outline:2px dashed var(--accent);outline-offset:-8px}
  .spk.has-video .spk-ph{display:none}

  /* ---------- header ---------- */
  .stripes{position:absolute;left:478px;top:46px;display:flex;gap:5px}
  .stripes i{display:block;width:14px;height:15px;background:var(--accent);transform:skewX(-22deg)}
  .st-title{position:absolute;left:478px;top:70px;font-size:58px;font-weight:800;letter-spacing:-.022em;line-height:1;color:var(--white);white-space:nowrap}
  .st-week{position:absolute;left:478px;top:150px;font-size:20px;font-weight:700;color:var(--accent);letter-spacing:.01em}
  .st-sub{position:absolute;left:478px;top:192px;font-size:15px;color:var(--muted)}

  .clock{position:absolute;right:52px;top:52px;text-align:right}
  .clock-time{font-family:var(--mono);font-size:31px;font-weight:700;letter-spacing:.02em;line-height:1}
  .clock-time .sep,.clock-time .tot{color:var(--dim)}
  .clock-lab{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.04em;margin-top:8px}
  .clock-track{position:absolute;right:52px;top:146px;width:260px;height:3px;background:#252B33;border-radius:2px;overflow:hidden}
  .clock-fill{height:100%;width:0;background:var(--accent)}

  .rule-top{position:absolute;left:66px;top:262px;width:1802px;height:1px;background:var(--line-soft)}

  /* ---------- left rail ---------- */
  .rail{position:absolute;left:66px;top:306px;width:424px}
  .card{
    position:relative;background:var(--panel);border-radius:4px;
    padding:17px 20px 16px 22px;margin-bottom:40px;height:150px;
    border-left:3px solid #2F3640;transition:background .35s,border-color .35s;
  }
  .card:last-child{margin-bottom:0}
  .card .num{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--dim);transition:color .35s}
  .card .ttl{font-size:21px;font-weight:700;color:#C9CFD6;margin-top:2px;line-height:1.25;transition:color .35s}
  .card .sub{font-size:14px;color:var(--dim);margin-top:6px;line-height:1.38;transition:color .35s}
  .card .bar{position:absolute;left:22px;right:20px;bottom:12px;height:2px;background:#232931;border-radius:1px;overflow:hidden}
  .card .bar i{display:block;height:100%;width:0;background:var(--accent)}
  .card.is-done{border-left-color:var(--teal)}
  .card.is-done .num{color:var(--teal)}
  .card.is-done .bar i{background:var(--teal)}
  .card.is-active{
    border-left-color:var(--accent);
    background:linear-gradient(90deg,rgba(242,180,23,.10) 0%,rgba(242,180,23,.03) 60%,var(--panel) 100%);
  }
  .card.is-active .num{color:var(--accent)}
  .card.is-active .ttl{color:var(--white)}
  .card.is-active .sub{color:var(--muted)}

  /* ---------- canvas & scenes ---------- */
  .canvas{position:absolute;left:606px;top:300px;width:1184px;height:640px}
  .scene{position:absolute;inset:0;opacity:0;visibility:hidden}
  .scene svg.art{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .r{opacity:0}

  .chip{
    position:absolute;display:inline-flex;align-items:center;gap:9px;
    background:var(--panel-2);border:1px solid var(--line);border-radius:4px;
    padding:8px 14px;font-size:17px;font-weight:600;color:#DCE1E6;white-space:nowrap;
  }
  .chip::before{content:"";width:9px;height:9px;background:var(--accent);flex:none}
  .chip.teal::before{background:var(--teal)}
  .chip.blue::before{background:var(--blue)}
  .chip.is-red{background:#3A1A19;border-color:#6E2B29;color:#F3D6D5}
  .chip.is-red::before{background:var(--red)}
  .chip.is-teal{background:#12302A;border-color:#22604F;color:#D2F5E8}
  .chip.is-teal::before{background:var(--teal)}
  .chip.boxed{border-color:var(--accent)}
  .chip.big{font-size:22px;padding:11px 18px}

  .scene-title{position:absolute;font-size:31px;font-weight:700;color:var(--white);letter-spacing:-.01em;white-space:nowrap}
  svg text{font-family:var(--mono)}
  .lbl{font-size:15px;letter-spacing:.14em;fill:#6B747E;font-weight:700}

  /* intro */
  .hello{position:absolute;left:24px;top:96px;font-family:var(--mono);font-size:15px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:700}
  .intro{position:absolute;left:24px;top:150px;display:flex;gap:30px;align-items:stretch}
  .intro-bar{width:6px;background:var(--accent);border-radius:2px;flex:none}
  .intro-title{font-size:56px;font-weight:800;line-height:1.06;letter-spacing:-.025em;color:var(--white);max-width:900px}
  .intro-sub{font-size:20px;color:var(--muted);margin-top:12px;max-width:860px}
  .agenda{position:absolute;left:24px;top:430px;display:flex;gap:14px}
  .ag{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:12px 18px;transition:border-color .3s,background .3s}
  .ag b{font-family:var(--mono);font-size:15px;color:var(--dim)}
  .ag span{font-size:18px;font-weight:600;color:#C9CFD6;white-space:nowrap}
  .ag.hl{border-color:var(--accent);background:rgba(242,180,23,.08)}
  .ag.hl b{color:var(--accent)} .ag.hl span{color:var(--white)}

  /* week strip */
  .week{position:absolute;left:52%;top:30%;display:flex;gap:10px}
  .day{width:74px;height:104px;border-radius:4px;background:var(--panel);border:1px solid var(--line);
       display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;position:relative}
  .day .dn{font-family:var(--mono);font-size:13px;letter-spacing:.12em;color:var(--dim);font-weight:700}
  .day .dd{font-size:30px;font-weight:800;color:#C9CFD6}
  .day.hl{background:var(--accent);border-color:var(--accent)}
  .day.hl .dn,.day.hl .dd{color:#14100A}
  .day .ring{position:absolute;inset:-4px;border:2px solid var(--accent);border-radius:7px;opacity:0;pointer-events:none}

  /* outro */
  .outro{position:absolute;left:24px;top:110px;width:1110px}
  .orow{display:flex;align-items:center;gap:22px;padding:13px 0;border-bottom:1px solid var(--line-soft)}
  .orow svg{width:38px;height:38px;flex:none}
  .orow span{font-size:28px;font-weight:700;color:var(--white)}
  .oclose{margin-top:30px;font-size:34px;font-weight:700;color:var(--accent)}
  .othanks{margin-top:8px;font-size:22px;font-weight:600;color:var(--muted)}

  /* caption */
  .rule-cap{position:absolute;left:66px;top:962px;width:1802px;height:1px;background:var(--line-soft)}
  .caption{position:absolute;left:66px;top:980px;width:1802px;font-size:22px;font-weight:600;line-height:1.42;color:var(--dim)}
  .caption .said{color:var(--white)}
  .caption .now{color:var(--accent)}

  /* big play */
  .bigplay{
    position:absolute;inset:0;width:100%;height:100%;border:0;cursor:pointer;
    background:rgba(6,8,11,.62);backdrop-filter:blur(2px);
    display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;
    color:var(--text);transition:opacity .3s,visibility .3s;
  }
  .bigplay[hidden]{display:flex;opacity:0;visibility:hidden;pointer-events:none}
  .bigplay .ring{width:84px;height:84px;border-radius:50%;background:var(--accent);display:grid;place-items:center;box-shadow:0 10px 34px rgba(242,180,23,.32)}
  .bigplay .ring svg{width:32px;height:32px;fill:#14100A;margin-left:4px}
  .bigplay .lab{font-family:var(--mono);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#C9CFD6}

  /* controls */
  .controls{display:flex;align-items:center;gap:14px;margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
  .ctl{background:none;border:0;color:var(--text);cursor:pointer;padding:6px;display:grid;place-items:center;border-radius:5px;flex:none}
  .ctl:hover{background:var(--panel-2)}
  .ctl:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .ctl svg{width:20px;height:20px;fill:currentColor}
  .ctl svg[hidden]{display:none}
  .seek{flex:1;-webkit-appearance:none;appearance:none;height:4px;border-radius:3px;background:#2B323A;cursor:pointer}
  .seek::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--accent);border:0;cursor:pointer}
  .seek::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--accent);border:0;cursor:pointer}
  .seek:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .tcode{font-family:var(--mono);font-size:12px;color:var(--muted);flex:none;letter-spacing:.03em}

  .meta{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 34px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
  .meta span{border:1px solid var(--line);border-radius:999px;padding:5px 12px;background:var(--panel)}

  h2{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:700;padding-bottom:10px;margin-bottom:4px;border-bottom:1px solid var(--line)}
  .priorities{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:14px 0 34px;list-style:none}
  .priorities li{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
  .priorities b{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--accent);font-weight:700;margin-bottom:6px}
  .priorities em{font-style:normal;font-size:15px;color:var(--text)}

  ol.cues{list-style:none;margin-top:8px}
  .cue{display:grid;grid-template-columns:64px 1fr;gap:16px;align-items:start;width:100%;text-align:left;background:none;border:0;color:inherit;font:inherit;padding:13px 10px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:6px;transition:background .15s}
  .cue:hover{background:var(--panel)}
  .cue:focus-visible{outline:none;background:var(--panel);box-shadow:inset 2px 0 0 var(--accent)}
  .cue time{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:3px}
  .cue span{font-size:16px}
  .cue[aria-current="true"]{background:var(--panel)}
  .cue[aria-current="true"] time{color:var(--accent)}
  .cue[aria-current="true"] span{color:var(--white)}
  .hint{font-size:13px;color:var(--muted);margin:14px 0 2px}

  footer{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

  @media (max-width:620px){
    .cue{grid-template-columns:52px 1fr;gap:12px}
    .brand-sub{padding-left:0;border-left:0;flex-basis:100%}
  }

  /* render mode (used to export the MP4): stage only, no chrome */
  html.render body{padding:0;background:#000}
  html.render .wrap{max-width:none}
  html.render .wrap > :not(.stage-outer){display:none!important}
  html.render .stage-outer{width:1920px;height:1080px;border:0;border-radius:0;box-shadow:none}
  html.render .bigplay{display:none}
  html.render .spk-ph > *{display:none}
  html.render *{transition:none!important}
</style>
</head>
<body>
<div class="wrap">

  <!-- ===== top bar : EN / ΕΛ language buttons ===== -->
  <div class="topbar">
    <div class="mark" aria-hidden="true"></div>
    <div class="brand">SAFEEYE</div>
    <div class="brand-sub" data-i18n="brandSub"></div>
    <div class="lang">
      <span class="lang-label" data-i18n="langLabel"></span>
      <button type="button" id="btnEn" lang="en" aria-pressed="true">EN</button>
      <button type="button" id="btnEl" lang="el" aria-pressed="false">ΕΛ</button>
    </div>
  </div>

  <h1 class="page-title" data-i18n="pageTitle"></h1>
  <p class="page-tag" data-i18n="pageTag"></p>

  <!-- ===== stage ===== -->
  <div class="stage-outer" id="stageOuter">
    <div class="stage" id="stage">

      <!-- reserved speaker window: 364 x 204 at (66, 50). Add your clip later:
           set SPEAKER_SRC in the script, or drop / pick an MP4 on the window. -->
      <div class="spk" id="spk">
        <video id="v" playsinline preload="metadata"></video>
        <button class="spk-ph" id="spkPh" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="6" width="13" height="12" rx="2"/><path d="M15.5 10.5 21.5 7v10l-6-3.5z"/></svg>
          <span class="l1" data-i18n="spkL1"></span>
          <span class="l2" data-i18n="spkL2"></span>
        </button>
        <input type="file" id="spkFile" accept="video/*" hidden>
      </div>

      <!-- header -->
      <div class="stripes" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="st-title" data-i18n="stTitle"></div>
      <div class="st-week" data-i18n="stWeek"></div>
      <div class="st-sub" data-i18n="stSub"></div>

      <div class="clock">
        <div class="clock-time"><span id="ctCur">00:00</span><span class="sep"> / </span><span class="tot" id="ctTot">01:04</span></div>
        <div class="clock-lab" data-i18n="clockLab"></div>
      </div>
      <div class="clock-track"><div class="clock-fill" id="clockFill"></div></div>
      <div class="rule-top"></div>

      <!-- left rail -->
      <div class="rail" id="rail">
        <div class="card"><div class="num">01</div><div class="ttl" data-i18n="p1t"></div><div class="sub" data-i18n="p1s"></div><div class="bar"><i></i></div></div>
        <div class="card"><div class="num">02</div><div class="ttl" data-i18n="p2t"></div><div class="sub" data-i18n="p2s"></div><div class="bar"><i></i></div></div>
        <div class="card"><div class="num">03</div><div class="ttl" data-i18n="p3t"></div><div class="sub" data-i18n="p3s"></div><div class="bar"><i></i></div></div>
      </div>

      <!-- canvas -->
      <div class="canvas">

        <!-- ===== scene 0 : intro (0.0 – 9.6) ===== -->
        <section class="scene" id="s0">
          <div class="hello r" data-in="0.1" data-i18n="hello"></div>
          <div class="intro">
            <div class="intro-bar r" data-in="1.2"></div>
            <div>
              <div class="intro-title r" data-in="1.3" data-i18n="introTitle"></div>
              <div class="intro-sub r" data-in="3.0" data-i18n="introSub"></div>
            </div>
          </div>
          <div class="agenda">
            <div class="ag r" data-in="6.2" id="ag0"><b>01</b><span data-i18n="p1t"></span></div>
            <div class="ag r" data-in="6.5"><b>02</b><span data-i18n="p2t"></span></div>
            <div class="ag r" data-in="6.8"><b>03</b><span data-i18n="p3t"></span></div>
          </div>
        </section>

        <!-- ===== scene 1 : metal cage entry (9.6 – 31.4) ===== -->
        <section class="scene" id="s1">
          <div class="scene-title r" data-in="9.7" style="left:2%;top:0" data-i18n="c1_title"></div>
          <svg class="art" viewBox="0 0 1184 640" aria-hidden="true">
            <line x1="0" y1="562" x2="1140" y2="562" stroke="#2A313A" stroke-width="2"/>

            <!-- worker inside the cage (drawn first so the bars sit in front) -->

      p1s: 'Άνοιγμα τουλάχιστον 60 cm, επιγονατίδες, επιβλέπων, βαρούλκο διάσωσης',
      p2t: 'Σκυροδέτηση · Τετάρτη',
      p2s: 'Τήρηση σχεδίου κυκλοφορίας· πρόσβαση από την πλευρά μακριά από τον σωλήνα',
      p3t: 'Σημαιοφόρος σε ετοιμότητα',
      p3s: 'Διαθέσιμος σημαιοφόρος για την κυκλοφορία της σκυροδέτησης',

      hello: 'Καλημέρα',
      introTitle: 'Οι προτεραιότητες ασφάλειας της εβδομάδας',
      introSub: 'Εβδομάδα 05.10.2026 · τρία πράγματα που πρέπει να είναι σωστά πριν ξεκινήσει η δουλειά.',

      c1_title: 'Είσοδος στον μεταλλικό κλωβό',
      c1_open: 'Άνοιγμα πρόσβασης',
      c1_knee: 'Προστασία γονάτων',
      c1_sup: 'Επιβλέπων σε επιτήρηση',

      c2_title: 'Σκυροδέτηση',
      c2_day: 'Τετάρτη 07.10',
      d1: 'ΔΕΥ', d2: 'ΤΡΙ', d3: 'ΤΕΤ', d4: 'ΠΕΜ', d5: 'ΠΑΡ', d6: 'ΣΑΒ', d7: 'ΚΥΡ',

      c3_title: 'Σχέδιο κυκλοφορίας',
      c3_follow: 'Τηρούμε το σχέδιο κυκλοφορίας',
      c3_chute: 'Περιοχή σωλήνα σκυροδέματος — όχι πρόσβαση',
      c3_access: 'Πρόσβαση από την άλλη πλευρά',
      c3_flag: 'Σημαιοφόρος διαθέσιμος',
      lRoad: 'ΟΔΟΣ ΕΡΓΟΤΑΞΙΟΥ', lGate: 'ΠΥΛΗ', lPour: 'ΠΕΡΙΟΧΗ ΣΚΥΡΟΔΕΤΗΣΗΣ', lPump: 'ΑΝΤΛΙΑ / ΣΩΛΗΝΑΣ',

      outroClose: 'Καλή και ασφαλή εβδομάδα.',
      outroThanks: 'Ευχαριστώ.',

      cap1: 'Καλημέρα. Αυτές είναι οι προτεραιότητες ασφάλειας για την εβδομάδα που ακολουθεί.',
      cap2: 'Πρώτα απ’ όλα:',
      cap3: 'Όσοι πρόκειται να μπουν στον μεταλλικό κλωβό χρειάζονται άνοιγμα πρόσβασης τουλάχιστον 60 εκατοστών.',
      cap4: 'Χρειάζονται προστασία γονάτων και, φυσικά, έναν επιβλέποντα να τους παρακολουθεί, και το βαρούλκο διάσωσης περιορισμένου χώρου θα είναι διαθέσιμο.',
      cap5: 'Φυσικά, έχουμε σκυροδέτηση την Τετάρτη, και πρέπει να τηρηθεί το σχέδιο κυκλοφορίας.',
      cap6: 'Η πρόσβαση του προσωπικού δεν γίνεται από την περιοχή του σωλήνα σκυροδέματος, αλλά από την άλλη πλευρά.',
      cap7: 'Πρέπει να είναι διαθέσιμος σημαιοφόρος.',
      cap8: 'Αυτές είναι οι προτεραιότητες της εβδομάδας. Καλή και ασφαλή εβδομάδα. Ευχαριστώ.',

      mRun: 'Διάρκεια 1:04',
      mPri: '3 Προτεραιότητες',
      mTalk: 'Σύντομη ενημέρωση',
      mWeek: 'Εβδομάδα 05.10.2026',
      hPriorities: 'Οι προτεραιότητες της εβδομάδας',
      hTranscript: 'Απομαγνητοφώνηση',
      hintJump: 'Επιλέξτε μια γραμμή για μετάβαση σε εκείνο το σημείο.',
      footL: 'SafeEye · Εβδομαδιαία Ενημέρωση',
      footR: 'Εβδομάδα 05.10.2026'
    }
  };

  var params = new URLSearchParams(location.search);
  var lang = params.get('lang') === 'el' ? 'el' : 'en';
  if (params.get('render') === '1') document.documentElement.classList.add('render');

  /* ---------------- elements ---------------- */
  var v       = document.getElementById('v');
  var spk     = document.getElementById('spk');
  var stage   = document.getElementById('stage');
  var outer   = document.getElementById('stageOuter');
  var capEl   = document.getElementById('caption');
  var cards   = [].slice.call(document.querySelectorAll('.card'));
  var bars    = cards.map(function (c) { return c.querySelector('.bar i'); });
  var scenes  = SCENES.map(function (s) { return document.getElementById(s.id); });
  var reveals = [].slice.call(document.querySelectorAll('.r[data-in]'));
  var draws   = [].slice.call(document.querySelectorAll('.dr[data-in]'));
  var ctCur   = document.getElementById('ctCur');
  var ctTot   = document.getElementById('ctTot');
  var fill    = document.getElementById('clockFill');
  var seek    = document.getElementById('seek');
  var tcode   = document.getElementById('tcode');
  var bigPlay = document.getElementById('bigPlay');
  var trList  = document.getElementById('tr');
  var truck   = document.getElementById('truck');
  var stripes = document.getElementById('drumStripes');
  var wed     = document.getElementById('wed');
  var wedRing = document.getElementById('wedRing');
  var route   = document.getElementById('route');
  var paddle  = document.getElementById('paddle');
  var ag0     = document.getElementById('ag0');

  draws.forEach(function (p) {
    var L = p.getTotalLength();
    p._len = L;
    p.style.strokeDasharray = L + ' ' + L;
  });

  /* ---------------- stage scaling ---------------- */
  function rescale() { stage.style.transform = 'scale(' + (outer.clientWidth / 1920) + ')'; }
  rescale();
  if (window.ResizeObserver) new ResizeObserver(rescale).observe(outer);
  window.addEventListener('resize', rescale);

  /* ---------------- helpers ---------------- */
  function clamp(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
  function ease(x) { x = clamp(x); return 1 - Math.pow(1 - x, 3); }
  function fmt(t) {
    if (!isFinite(t) || t < 0) t = 0;
    var m = Math.floor(t / 60), s = Math.floor(t % 60);
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }

  /* ---------------- clock: video if present, else internal timer ---------------- */
  var useVideo = false, vt = 0, playing = false, last = 0;
  function dur() { return (useVideo && v.duration && isFinite(v.duration)) ? v.duration : BASE_DUR; }
  function now() { return useVideo ? v.currentTime : vt; }
  function setTime(t) {
    t = Math.max(0, Math.min(t, dur()));
    if (useVideo) v.currentTime = t; else vt = t;
    render(t);
  }
  function play() {
    if (useVideo) { var p = v.play(); if (p && p.catch) p.catch(function () {}); return; }
    if (vt >= dur() - 0.05) vt = 0;
    playing = true; last = performance.now(); onPlay();
  }
  function pause() {
    if (useVideo) { v.pause(); return; }
    playing = false; onPause();
  }
  function isPlaying() { return useVideo ? !v.paused : playing; }
  function toggle() { if (isPlaying()) pause(); else play(); }

  function loadVideo(src) {
    pause();
    v.src = src;
    useVideo = true;
    spk.classList.add('has-video');
    v.load();
  }

  /* ---------------- i18n ---------------- */
  function applyLang() {
    var d = I18N[lang];
    document.documentElement.lang = lang;
    [].forEach.call(document.querySelectorAll('[data-i18n]'), function (el) {
      var k = el.getAttribute('data-i18n');
      if (d[k] != null) el.textContent = d[k];
    });
    document.getElementById('btnEn').setAttribute('aria-pressed', lang === 'en');
    document.getElementById('btnEl').setAttribute('aria-pressed', lang === 'el');
    document.title = d.pageTitle + ' — ' + d.stWeek;
    buildCaptions();
    buildTranscript();
    render(now());
  }

  /* ---------------- captions (word-by-word highlight) ---------------- */
  var capNodes = [];
  function buildCaptions() {
    capEl.textContent = '';
    capNodes = CAPS.map(function (c) {
      var holder = document.createElement('div');
      holder.style.display = 'none';
      var spans = I18N[lang][c.k].split(/\s+/).map(function (w, i) {
        var sp = document.createElement('span');
        sp.textContent = (i ? ' ' : '') + w;
        holder.appendChild(sp);
        return sp;
      });
      capEl.appendChild(holder);
      return { holder: holder, spans: spans };
    });
  }
  function paintCaption(t) {
    var idx = -1;
    for (var i = 0; i < CAPS.length; i++) {
      var nextT0 = i + 1 < CAPS.length ? CAPS[i + 1].t0 - 0.25 : 1e9;
      if (t >= CAPS[i].t0 - 0.25 && t < Math.min(CAPS[i].t1 + 1.2, nextT0)) { idx = i; break; }
    }
    for (var j = 0; j < capNodes.length; j++) capNodes[j].holder.style.display = (j === idx) ? 'block' : 'none';
    if (idx < 0 || !capNodes[idx]) return;
    var c = CAPS[idx], node = capNodes[idx];
    var p = clamp((t - c.t0) / (c.t1 - c.t0));
    var cur = Math.min(node.spans.length - 1, Math.floor(p * node.spans.length));
    for (var k = 0; k < node.spans.length; k++) node.spans[k].className = k < cur ? 'said' : (k === cur ? 'now' : '');
  }

  /* ---------------- transcript list ---------------- */
  var cueBtns = [];
  function buildTranscript() {
    trList.textContent = '';
    cueBtns = CAPS.map(function (c) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'cue';
      var tm = document.createElement('time'); tm.textContent = fmt(c.t0);
      var sp = document.createElement('span'); sp.textContent = I18N[lang][c.k];
      b.appendChild(tm); b.appendChild(sp);
      b.addEventListener('click', function () { setTime(c.t0); play(); });
      li.appendChild(b); trList.appendChild(li);
      return b;
    });
  }

  /* ---------------- main render: everything is a pure function of t ---------------- */
  function render(t) {
    // scenes: 0.4 s cross-fade
    for (var i = 0; i < SCENES.length; i++) {
      var s = SCENES[i];
      var o = (i === 0 ? 1 : ease((t - s.t0) / 0.4)) * (1 - ease((t - s.t1) / 0.35));
      scenes[i].style.opacity = o;
      scenes[i].style.visibility = o > 0.001 ? 'visible' : 'hidden';
    }

    // rail cards
    for (var c = 0; c < cards.length; c++) {
      var ct = CARDT[c];
      var active = t >= ct.t0 && t < ct.t1;
      cards[c].classList.toggle('is-active', active);
      cards[c].classList.toggle('is-done', t >= ct.t1);
      bars[c].style.width = (clamp((t - ct.t0) / (ct.t1 - ct.t0)) * 100) + '%';
    }

    // reveals (fade + rise for HTML, fade for SVG)
    for (var r = 0; r < reveals.length; r++) {
      var el = reveals[r];
      var e = ease((t - parseFloat(el.getAttribute('data-in'))) / 0.5);
      el.style.opacity = e;
      if (!(el instanceof SVGElement)) el.style.translate = '0 ' + ((1 - e) * 12).toFixed(2) + 'px';
    }
    // draw-on strokes
    for (var d = 0; d < draws.length; d++) {
      var p = draws[d];
      var k = ease((t - parseFloat(p.getAttribute('data-in'))) / parseFloat(p.getAttribute('data-dur') || 1));
      p.style.strokeDashoffset = (p._len * (1 - k)).toFixed(1);
      p.style.opacity = k > 0 ? 1 : 0;
    }

    // motion details
    ag0.classList.toggle('hl', t >= 7.4);
    var tx = -480 + 560 * ease((t - 34.0) / 1.6);
    truck.setAttribute('transform', 'translate(' + tx.toFixed(1) + ',0)');
    stripes.setAttribute('transform', 'translate(' + ((t * 70) % 80).toFixed(1) + ',0)');
    wed.classList.toggle('hl', t >= 35.9);
    var pr = t >= 35.9 ? ((t - 35.9) % 1.2) / 1.2 : 1;
    wedRing.style.opacity = t >= 35.9 ? (1 - pr) : 0;
    wedRing.style.transform = 'scale(' + (1 + pr * 0.18).toFixed(3) + ')';
    route.style.strokeDashoffset = (-t * 60).toFixed(1);
    paddle.setAttribute('transform', 'rotate(' + (Math.sin(t * 5) * 14).toFixed(2) + ' 1050 226)');

    // caption + clock + controls
    paintCaption(t);
    var D = dur();
    ctCur.textContent = fmt(t);
    ctTot.textContent = fmt(D);
    fill.style.width = Math.min(100, (t / D) * 100) + '%';
    tcode.textContent = fmt(t) + ' / ' + fmt(D);
    if (document.activeElement !== seek) seek.value = String(Math.round((t / D) * 1000));

    var ci = -1;
    for (var q = 0; q < CAPS.length; q++) { if (t >= CAPS[q].t0 - 0.25) ci = q; }
    for (var w = 0; w < cueBtns.length; w++) {
      if (w === ci) cueBtns[w].setAttribute('aria-current', 'true'); else cueBtns[w].removeAttribute('aria-current');
    }
  }
  window.__frame = function (t) { render(t); };   // used by the MP4 exporter

  /* ---------------- playback loop ---------------- */
  var raf = 0;
  function loop(ts) {
    if (!useVideo && playing) {
      vt += (ts - last) / 1000; last = ts;
      if (vt >= dur()) { vt = dur(); playing = false; onEnded(); }
    }
    render(now());
    if (isPlaying()) raf = requestAnimationFrame(loop); else raf = 0;
  }
  var icPlay = document.getElementById('icPlay');
  var icPause = document.getElementById('icPause');
  function setIcon(on) { icPlay.hidden = on; icPause.hidden = !on; }
  function onPlay() { bigPlay.hidden = true; setIcon(true); if (!raf) raf = requestAnimationFrame(function (ts) { last = ts; loop(ts); }); }
  function onPause() { setIcon(false); render(now()); }
  function onEnded() { setIcon(false); bigPlay.hidden = false; }

  v.addEventListener('play', onPlay);
  v.addEventListener('pause', onPause);
  v.addEventListener('ended', onEnded);
  v.addEventListener('seeked', function () { render(now()); });
  v.addEventListener('loadedmetadata', function () { render(now()); });

  bigPlay.addEventListener('click', toggle);
  document.getElementById('btnPlay').addEventListener('click', toggle);
  document.getElementById('btnRestart').addEventListener('click', function () { setTime(0); play(); });
  seek.addEventListener('input', function () { setTime((seek.value / 1000) * dur()); });

  var icSound = document.getElementById('icSound');
  var icMuted = document.getElementById('icMuted');
  document.getElementById('btnMute').addEventListener('click', function () {
    v.muted = !v.muted; icSound.hidden = v.muted; icMuted.hidden = !v.muted;
  });
  document.getElementById('btnFs').addEventListener('click', function () {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (outer.requestFullscreen) outer.requestFullscreen();
  });
  document.addEventListener('fullscreenchange', rescale);
  document.addEventListener('keydown', function (e) {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;
    if (e.code === 'Space' || e.key === 'k') { e.preventDefault(); toggle(); }
  });

  /* ---------------- speaker window: pick or drop a clip ---------------- */
  var fileIn = document.getElementById('spkFile');
  document.getElementById('spkPh').addEventListener('click', function (e) { e.stopPropagation(); fileIn.click(); });
  fileIn.addEventListener('change', function () {
    if (fileIn.files && fileIn.files[0]) { loadVideo(URL.createObjectURL(fileIn.files[0])); setTime(0); }
  });
  ['dragenter', 'dragover'].forEach(function (n) {
    outer.addEventListener(n, function (e) { e.preventDefault(); spk.classList.add('drag'); });
  });
  ['dragleave', 'drop'].forEach(function (n) {
    outer.addEventListener(n, function () { spk.classList.remove('drag'); });
  });
  outer.addEventListener('drop', function (e) {
    e.preventDefault();
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f && /^video\//.test(f.type)) { loadVideo(URL.createObjectURL(f)); setTime(0); }
  });

  /* ---------------- language buttons ---------------- */
  document.getElementById('btnEn').addEventListener('click', function () { lang = 'en'; applyLang(); });
  document.getElementById('btnEl').addEventListener('click', function () { lang = 'el'; applyLang(); });

  /* ---------------- go ---------------- */
  applyLang();                                // build captions before the video can trigger a render
  if (SPEAKER_SRC) loadVideo(SPEAKER_SRC);
  render(0);
})();
</script>
