<style>
  :root{
    --bg:#08090C;
    --stage-a:#101419;
    --stage-b:#0B0E12;
    --panel:#161A20;
    --panel-2:#1B2026;
    --line:#252B33;
    --line-soft:#1E232A;
    --accent:#F2B417;
    --accent-hi:#FFD24D;
    --teal:#3ED6A0;
    --red:#E0413E;
    --blue:#7FB2D8;
    --steel:#8FA3B4;
    --text:#E9ECEF;
    --white:#FFFFFF;
    --muted:#8B939C;
    --dim:#5E666F;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--bg);color:var(--text);font-family:var(--sans);
    line-height:1.55;-webkit-font-smoothing:antialiased;
    padding:clamp(14px,3vw,34px);
  }
  .wrap{max-width:1240px;margin:0 auto}

  /* ---------- top bar ---------- */
  .topbar{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding-bottom:16px;margin-bottom:20px;border-bottom:1px solid var(--line);
  }
  .mark{width:24px;height:15px;border-radius:3px;background:var(--accent);flex:none}
  .brand{font-family:var(--mono);font-weight:700;letter-spacing:.14em;font-size:15px}
  .brand-sub{
    font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--muted);
    text-transform:uppercase;padding-left:14px;border-left:1px solid var(--line);
  }
  .lang{margin-left:auto;display:flex;gap:6px;align-items:center}
  .lang-label{
    font-family:var(--mono);font-size:10px;letter-spacing:.18em;
    color:var(--dim);text-transform:uppercase;margin-right:4px;
  }
  .lang button{
    font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.12em;
    color:var(--muted);background:var(--panel);border:1px solid var(--line);
    padding:7px 14px;border-radius:6px;cursor:pointer;
    transition:background .15s,color .15s,border-color .15s;
  }
  .lang button:hover{color:var(--text);border-color:#39424c}
  .lang button[aria-pressed="true"]{
    background:var(--accent);border-color:var(--accent);color:#14100A;
  }
  .lang button:focus-visible{outline:2px solid var(--accent-hi);outline-offset:2px}

  h1.page-title{
    font-size:clamp(26px,4.4vw,40px);line-height:1.05;letter-spacing:-.02em;
    font-weight:800;margin-bottom:6px;
  }
  .page-tag{color:var(--muted);font-size:15px;margin-bottom:20px;max-width:64ch}

  /* ---------- stage ---------- */
  .stage-outer{
    position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;
    background:#000;border:1px solid var(--line);border-radius:10px;
    box-shadow:0 20px 56px rgba(0,0,0,.55);
  }
  .stage{
    position:absolute;top:0;left:0;width:1920px;height:1080px;
    transform-origin:top left;
    background:
      radial-gradient(1200px 700px at 72% 18%, #151A21 0%, rgba(21,26,33,0) 62%),
      linear-gradient(160deg,var(--stage-a) 0%,var(--stage-b) 60%,#080A0D 100%);
    font-size:16px;
  }

  /* speaker window (the predefined window) */
  .spk{
    position:absolute;left:66px;top:50px;width:364px;height:204px;
    border:1px solid #2A3038;border-radius:4px;overflow:hidden;background:#07090B;
  }
  .spk video{width:100%;height:100%;object-fit:cover;display:block;background:#07090B}
  .spk::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    box-shadow:inset 0 0 40px rgba(0,0,0,.45);
  }

  /* header block */
  .stripes{position:absolute;left:478px;top:46px;display:flex;gap:5px}
  .stripes i{display:block;width:14px;height:15px;background:var(--accent);transform:skewX(-22deg)}
  .st-title{
    position:absolute;left:478px;top:70px;font-size:58px;font-weight:800;
    letter-spacing:-.022em;line-height:1;color:var(--white);
  }
  .st-week{
    position:absolute;left:478px;top:150px;font-size:20px;font-weight:700;
    color:var(--accent);letter-spacing:.01em;
  }
  .st-sub{position:absolute;left:478px;top:192px;font-size:15px;color:var(--muted)}

  .clock{position:absolute;right:52px;top:52px;text-align:right}
  .clock-time{font-family:var(--mono);font-size:31px;font-weight:700;letter-spacing:.02em;line-height:1}
  .clock-time .sep,.clock-time .tot{color:var(--dim)}
  .clock-lab{
    font-family:var(--mono);font-size:11px;color:var(--muted);
    letter-spacing:.04em;margin-top:8px;
  }
  .clock-track{
    position:absolute;right:52px;top:146px;width:260px;height:3px;
    background:#252B33;border-radius:2px;overflow:hidden;
  }
  .clock-fill{height:100%;width:0;background:var(--accent);transition:width .12s linear}

  .rule-top{position:absolute;left:66px;top:262px;width:1802px;height:1px;background:var(--line-soft)}

  /* left rail */
  .rail{position:absolute;left:66px;top:306px;width:424px}
  .card{
    position:relative;background:var(--panel);border-radius:4px;
    padding:15px 20px 16px 22px;margin-bottom:38px;height:128px;
    border-left:3px solid #2F3640;
    transition:background .35s,border-color .35s;
  }
  .card:last-child{margin-bottom:0}
  .card .num{
    font-family:var(--mono);font-size:15px;font-weight:700;color:var(--dim);
    transition:color .35s;
  }
  .card .ttl{font-size:20px;font-weight:700;color:#C9CFD6;margin-top:2px;transition:color .35s}
  .card .sub{font-size:14px;color:var(--dim);margin-top:5px;line-height:1.35;transition:color .35s}
  .card.is-done{border-left-color:var(--teal)}
  .card.is-done .num{color:var(--teal)}
  .card.is-done .ttl{color:#C9CFD6}
  .card.is-active{
    border-left-color:var(--accent);
    background:linear-gradient(90deg,rgba(242,180,23,.10) 0%,rgba(242,180,23,.03) 60%,var(--panel) 100%);
  }
  .card.is-active .num{color:var(--accent)}
  .card.is-active .ttl{color:var(--white)}
  .card.is-active .sub{color:var(--muted)}

  /* canvas */
  .canvas{position:absolute;left:606px;top:300px;width:1184px;height:640px}
  .scene{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .4s ease}
  .scene.active{opacity:1;visibility:visible}
  .scene svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}

  /* reveal */
  .r{opacity:0;transform:translateY(10px);transition:opacity .45s ease,transform .45s ease}
  .r.on{opacity:1;transform:none}
  svg .r{transition:opacity .45s ease}

  /* chips */
  .chip{
    position:absolute;display:inline-flex;align-items:center;gap:9px;
    background:var(--panel-2);border:1px solid var(--line);border-radius:4px;
    padding:8px 14px;font-size:17px;font-weight:600;color:#DCE1E6;white-space:nowrap;
  }
  .chip::before{content:"";width:9px;height:9px;background:var(--accent);flex:none}
  .chip.teal::before{background:var(--teal)}
  .chip.is-red{background:#3A1A19;border-color:#6E2B29;color:#F3D6D5}
  .chip.is-red::before{background:var(--red)}
  .chip.boxed{border-color:var(--accent)}

  .scene-title{
    position:absolute;font-size:31px;font-weight:700;color:var(--white);
    letter-spacing:-.01em;white-space:nowrap;
  }

  /* intro scene */
  .intro{position:absolute;left:24px;top:170px;display:flex;gap:30px;align-items:stretch}
  .intro-bar{width:6px;background:var(--accent);border-radius:2px;flex:none}
  .intro-title{font-size:56px;font-weight:800;line-height:1.06;letter-spacing:-.025em;color:var(--white);max-width:820px}
  .intro-sub{font-size:20px;color:var(--muted);margin-top:10px;max-width:820px}
  .intro-rule{position:absolute;left:0;top:520px;width:1120px;height:1px;background:var(--line-soft)}

  /* outro scene */
  .outro{position:absolute;left:24px;top:110px;width:1110px}
  .orow{
    display:flex;align-items:center;gap:22px;
    padding:11px 0;border-bottom:1px solid var(--line-soft);
  }
  .orow svg{position:static;width:38px;height:38px;flex:none}
  .orow span{font-size:26px;font-weight:700;color:var(--white)}
  .oclose{margin-top:26px;font-size:32px;font-weight:700;color:var(--accent)}

  /* caption */
  .rule-cap{position:absolute;left:66px;top:962px;width:1802px;height:1px;background:var(--line-soft)}
  .caption{
    position:absolute;left:66px;top:980px;width:1802px;
    font-size:22px;font-weight:600;line-height:1.42;color:var(--dim);
  }
  .caption .said{color:var(--white)}
  .caption .now{color:var(--accent)}

  /* big play */
  .bigplay{
    position:absolute;inset:0;width:100%;height:100%;border:0;cursor:pointer;
    background:rgba(6,8,11,.62);backdrop-filter:blur(2px);
    display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;
    color:var(--text);transition:opacity .3s,visibility .3s;
  }
  .bigplay[hidden]{display:flex;opacity:0;visibility:hidden;pointer-events:none}
  .bigplay .ring{
    width:84px;height:84px;border-radius:50%;background:var(--accent);
    display:grid;place-items:center;box-shadow:0 10px 34px rgba(242,180,23,.32);
  }
  .bigplay .ring svg{width:32px;height:32px;fill:#14100A;margin-left:4px}
  .bigplay .lab{
    font-family:var(--mono);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#C9CFD6;
  }

  /* controls */
  .controls{
    display:flex;align-items:center;gap:14px;margin-top:12px;
    background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;
  }
  .ctl{
    background:none;border:0;color:var(--text);cursor:pointer;padding:6px;
    display:grid;place-items:center;border-radius:5px;flex:none;
  }
  .ctl:hover{background:var(--panel-2)}
  .ctl:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .ctl svg{width:20px;height:20px;fill:currentColor}
  .ctl svg[hidden]{display:none}
  .seek{
    flex:1;-webkit-appearance:none;appearance:none;height:4px;border-radius:3px;
    background:#2B323A;cursor:pointer;
  }
  .seek::-webkit-slider-thumb{
    -webkit-appearance:none;width:13px;height:13px;border-radius:50%;
    background:var(--accent);border:0;cursor:pointer;
  }
  .seek::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--accent);border:0;cursor:pointer}
  .seek:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .tcode{font-family:var(--mono);font-size:12px;color:var(--muted);flex:none;letter-spacing:.03em}

  /* sections below */
  .meta{
    display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 34px;
    font-family:var(--mono);font-size:11px;letter-spacing:.1em;
    color:var(--muted);text-transform:uppercase;
  }
  .meta span{border:1px solid var(--line);border-radius:999px;padding:5px 12px;background:var(--panel)}

  h2{
    font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--muted);font-weight:700;
    padding-bottom:10px;margin-bottom:4px;border-bottom:1px solid var(--line);
  }
  .priorities{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;
    margin:14px 0 34px;list-style:none;
  }
  .priorities li{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
  .priorities b{
    display:block;font-family:var(--mono);font-size:11px;letter-spacing:.16em;
    color:var(--accent);font-weight:700;margin-bottom:6px;
  }
  .priorities em{font-style:normal;font-size:15px;color:var(--text)}

  ol.cues{list-style:none;margin-top:8px}
  .cue{
    display:grid;grid-template-columns:64px 1fr;gap:16px;align-items:start;
    width:100%;text-align:left;background:none;border:0;color:inherit;font:inherit;
    padding:13px 10px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:6px;
    transition:background .15s;
  }
  .cue:hover{background:var(--panel)}
  .cue:focus-visible{outline:none;background:var(--panel);box-shadow:inset 2px 0 0 var(--accent)}
  .cue time{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:3px}
  .cue span{font-size:16px}
  .cue[aria-current="true"]{background:var(--panel)}
  .cue[aria-current="true"] time{color:var(--accent)}
  .cue[aria-current="true"] span{color:var(--white)}
  .hint{font-size:13px;color:var(--muted);margin:14px 0 2px}

  footer{
    margin-top:40px;padding-top:18px;border-top:1px solid var(--line);
    font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--muted);
    text-transform:uppercase;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
  }

  @media (max-width:620px){
    .cue{grid-template-columns:52px 1fr;gap:12px}
    .brand-sub{padding-left:0;border-left:0;flex-basis:100%}
    .lang{margin-left:auto}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
  }
</style>
</head>

      b.appendChild(tm); b.appendChild(sp);
      b.addEventListener('click', function () {
        v.currentTime = c.t0;
        var pr = v.play();
        if (pr && pr.catch) pr.catch(function () {});
      });
      li.appendChild(b);
      trList.appendChild(li);
      return b;
    });
  }

  /* ---------------- main render ---------------- */
  var lastScene = -1;

  function render(t, force) {
    // scene + cards
    var si = 0;
    for (var i = 0; i < SCENES.length; i++) {
      if (t >= SCENES[i].t0) si = i;
    }
    if (si !== lastScene || force) {
      for (var j = 0; j < scenes.length; j++) {
        scenes[j].classList.toggle('active', j === si);
      }
      lastScene = si;
    }
    var activeCard = SCENES[si].card;
    for (var c = 0; c < cards.length; c++) {
      var passed = false;
      for (var s = 0; s < SCENES.length; s++) {
        if (SCENES[s].card === c && t >= SCENES[s].t1) passed = true;
      }
      cards[c].classList.toggle('is-active', c === activeCard);
      cards[c].classList.toggle('is-done', passed && c !== activeCard);
    }

    // reveals
    for (var r = 0; r < reveals.length; r++) {
      reveals[r].classList.toggle('on', t >= parseFloat(reveals[r].getAttribute('data-in')));
    }

    // caption
    paintCaption(t);

    // clock + controls
    var dur = (v.duration && isFinite(v.duration)) ? v.duration : BASE_DUR;
    ctCur.textContent = fmt(t);
    ctTot.textContent = fmt(dur);
    fill.style.width = Math.min(100, (t / dur) * 100) + '%';
    tcode.textContent = fmt(t) + ' / ' + fmt(dur);
    if (document.activeElement !== seek) seek.value = String(Math.round((t / dur) * 1000));

    // transcript highlight
    var ci = -1;
    for (var q = 0; q < CAPS.length; q++) { if (t >= CAPS[q].t0 - 0.25) ci = q; }
    for (var w = 0; w < cueBtns.length; w++) {
      if (w === ci) cueBtns[w].setAttribute('aria-current', 'true');
      else cueBtns[w].removeAttribute('aria-current');
    }
  }

  /* ---------------- playback wiring ---------------- */
  var raf = 0;
  function loop() {
    render(v.currentTime, false);
    raf = requestAnimationFrame(loop);
  }

  v.addEventListener('play', function () {
    bigPlay.hidden = true;
    setIcon(true);
    if (!raf) raf = requestAnimationFrame(loop);
  });
  v.addEventListener('pause', function () {
    setIcon(false);
    cancelAnimationFrame(raf); raf = 0;
    render(v.currentTime, false);
  });
  v.addEventListener('ended', function () {
    setIcon(false);
    bigPlay.hidden = false;
    cancelAnimationFrame(raf); raf = 0;
  });
  v.addEventListener('seeked', function () { render(v.currentTime, true); });
  v.addEventListener('loadedmetadata', function () { render(v.currentTime, true); });

  function toggle() {
    if (v.paused) {
      var p = v.play();
      if (p && p.catch) p.catch(function () {});
    } else {
      v.pause();
    }
  }

  var icPlay = document.getElementById('icPlay');
  var icPause = document.getElementById('icPause');
  function setIcon(playing) {
    icPlay.hidden = playing;
    icPause.hidden = !playing;
  }

  bigPlay.addEventListener('click', toggle);
  document.getElementById('btnPlay').addEventListener('click', toggle);
  document.getElementById('btnRestart').addEventListener('click', function () {
    v.currentTime = 0;
    var p = v.play();
    if (p && p.catch) p.catch(function () {});
  });
  seek.addEventListener('input', function () {
    var dur = (v.duration && isFinite(v.duration)) ? v.duration : BASE_DUR;
    v.currentTime = (seek.value / 1000) * dur;
    render(v.currentTime, true);
  });

  var icSound = document.getElementById('icSound');
  var icMuted = document.getElementById('icMuted');
  document.getElementById('btnMute').addEventListener('click', function () {
    v.muted = !v.muted;
    icSound.hidden = v.muted;
    icMuted.hidden = !v.muted;
  });
  document.getElementById('btnFs').addEventListener('click', function () {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (outer.requestFullscreen) outer.requestFullscreen();
  });
  document.addEventListener('fullscreenchange', rescale);

  document.addEventListener('keydown', function (e) {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;
    if (e.code === 'Space' || e.key === 'k') { e.preventDefault(); toggle(); }
  });

  /* ---------------- language buttons ---------------- */
  document.getElementById('btnEn').addEventListener('click', function () { lang = 'en'; applyLang(); });
  document.getElementById('btnEl').addEventListener('click', function () { lang = 'el'; applyLang(); });

  /* ---------------- go ---------------- */
  applyLang();
  render(0, true);
})();
</script>
</body>
</html>
